<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KSTV Icons - Event Confirmation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(34, 211, 238, 0.14), transparent 30%),
        linear-gradient(180deg, #020617 0%, #020817 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .confirmation-page {
      background: linear-gradient(135deg, #0f172a 0%, #1a1f2e 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .checkmark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      margin: 0 auto 24px;
      animation: scaleIn 0.5s ease-out;
    }

    @keyframes scaleIn {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }

    .checkmark svg {
      width: 48px;
      height: 48px;
      color: white;
    }

    .page-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-bottom: 32px;
    }

    .info-section {
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #64748b;
      margin-bottom: 8px;
    }

    .participant-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #06b6d4;
      word-break: break-word;
    }

    .event-details {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .detail-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .detail-item:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-size: 0.875rem;
      color: #cbd5e1;
      text-align: left;
    }

    .detail-value {
      font-size: 0.875rem;
      font-weight: 600;
      color: #10b981;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #10b981;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .back-button {
      padding: 12px 24px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 16px;
      color: #fca5a5;
      margin-bottom: 24px;
    }

    @media (max-width: 640px) {
      .confirmation-page {
        padding: 24px;
      }

      .page-title {
        font-size: 1.5rem;
      }

      .participant-name {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="confirmation-page" id="confirmationPage">
    <div class="checkmark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1 class="page-title">Welcome! 🎉</h1>
    <p class="page-subtitle">Your attendance has been confirmed</p>

    <div class="status-badge">
      <span class="status-dot"></span>
      Confirmed
    </div>

    <div class="info-section">
      <div class="info-label">Registered Participant</div>
      <div class="participant-name" id="participantName">Loading...</div>
    </div>

    <div class="event-details">
      <div class="detail-item">
        <span class="detail-label">Event</span>
        <span class="detail-value">KSTV Icons Hangout</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Date</span>
        <span class="detail-value">30th August, 2026</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Location</span>
        <span class="detail-value">Kano</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">Status</span>
        <span class="detail-value">✓ Checked In</span>
      </div>
    </div>

    <button class="back-button" onclick="goBack()">Back to Registration</button>
  </div>

  <script>
    // Get participant name from URL parameter
    function getParticipantName() {
      const urlParams = new URLSearchParams(window.location.search);
      const name = urlParams.get('name');
      
      if (name) {
        document.getElementById('participantName').textContent = decodeURIComponent(name);
      } else {
        document.getElementById('confirmationPage').innerHTML = `
          <div class="error-message">
            <strong>Oops!</strong> Unable to load participant information. Please scan the QR code again.
          </div>
          <button class="back-button" onclick="goBack()">Back to Registration</button>
        `;
      }
    }

    function goBack() {
      window.location.href = 'index.html';
    }

    // Load participant name on page load
    document.addEventListener('DOMContentLoaded', getParticipantName);
  </script>
</body>
</html>
